[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nofuturedata"
version = "0.3.0"
description = "Fail-closed temporal leakage checks for time-series, ML, and backtests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NoFutureData maintainers" }]
keywords = [
  "data-leakage",
  "lookahead-bias",
  "machine-learning",
  "time-series",
  "backtesting",
  "point-in-time",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ORANGINGS/nofuturedata"
Documentation = "https://orangings.github.io/nofuturedata/"
Issues = "https://github.com/ORANGINGS/nofuturedata/issues"

[project.scripts]
nofuture = "nofuturedata.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

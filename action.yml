name: "NoFutureData Temporal Leakage Guard"
description: "Fail CI when Python or Jupyter code reads information from the future."
branding:
  icon: "shield"
  color: "purple"
inputs:
  path:
    description: "File or directory to scan (Python and Jupyter notebooks)"
    required: false
    default: "."
  sarif:
    description: "Optional SARIF output path"
    required: false
    default: ""
  upload-sarif:
    description: "Upload SARIF to GitHub Code Scanning (caller needs security-events: write)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - id: scan
      shell: bash
      env:
        NOFUTURE_PATH: ${{ inputs.path }}
        NOFUTURE_SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        if [ -n "$NOFUTURE_SARIF" ]; then
          nofuture scan "$NOFUTURE_PATH" --sarif "$NOFUTURE_SARIF"
        else
          nofuture scan "$NOFUTURE_PATH"
        fi
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - if: ${{ inputs.upload-sarif == 'true' && inputs.sarif != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif }}
    - shell: bash
      run: exit "${{ steps.scan.outputs.status }}"

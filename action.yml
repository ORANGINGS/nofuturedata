name: "NoFutureData temporal leakage scan"
description: "Fail CI when Python source contains common future-looking data patterns."
inputs:
  path:
    description: "File or directory to scan"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - shell: bash
      run: nofuture scan "${{ inputs.path }}"


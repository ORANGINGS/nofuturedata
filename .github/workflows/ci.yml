name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest
      - run: nofuture scan src tests examples/safe_pipeline.py --sarif nofuturedata.sarif
      - name: pre-commit hook smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pre-commit==4.3.0
          pre-commit try-repo . nofuturedata --files examples/safe_pipeline.py
      - name: action smoke test
        uses: ./
        with:
          path: src
